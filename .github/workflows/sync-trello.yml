name: Sync Daybreak from Trello

on:
  schedule:
    # 05:30 UTC daily — before the 06:00 devotion block, so the dashboard is
    # already current when Kevin opens it.
    - cron: '30 5 * * *'
  workflow_dispatch:

# Only the commit is needed here; the existing pages.yml handles publishing.
permissions:
  contents: write

concurrency:
  group: sync-trello
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/claude-md-documentation-qnnt47

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check credentials
        id: creds
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
        run: |
          if [ -z "$TRELLO_KEY" ]; then
            echo "TRELLO_KEY is not set — add it under Settings → Secrets → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync from Trello
        if: steps.creds.outputs.ok == 'true'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
        run: node scripts/sync-trello.mjs

      - name: Commit if the dashboard changed
        if: steps.creds.outputs.ok == 'true'
        run: |
          if git diff --quiet -- index.html; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "daybreak-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync projects from Trello

          Regenerated by .github/workflows/sync-trello.yml."
          git push
