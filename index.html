<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybreak</title>

<!-- Installable web app. iOS ignores the manifest's display/orientation, so the
     apple-* tags below cover it and a CSS overlay handles rotation there. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16A34A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybreak">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style>
  :root{
    --bg:#F5F6F8; --card:#FFFFFF; --ink:#111827; --ink-2:#374151; --muted:#6B7280; --line:#E5E7EB;
    --green:#16A34A; --green-deep:#15803D; --green-soft:#E8F6EE; --green-tint:#F0FAF4;
    --blue:#2563EB; --blue-soft:#EAF1FE; --purple:#8B5CF6; --purple-soft:#F3EFFE;
    --orange:#F59E0B; --orange-soft:#FEF3E2; --track:#E9ECEF;
    --shadow:0 1px 2px rgba(17,24,39,.04),0 8px 24px rgba(17,24,39,.06);
    --nav-bg:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1113; --card:#181C1F; --ink:#F3F4F6; --ink-2:#D1D5DB; --muted:#9CA3AF; --line:#2A2F34;
      --green:#34C97A; --green-deep:#4ADE80; --green-soft:#173425; --green-tint:#14251C;
      --blue:#60A5FA; --blue-soft:#1B2A44; --purple:#A78BFA; --purple-soft:#2A2344;
      --orange:#FBBF24; --orange-soft:#3A2C12; --track:#2A2F34;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
      --nav-bg:#15181B;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1113; --card:#181C1F; --ink:#F3F4F6; --ink-2:#D1D5DB; --muted:#9CA3AF; --line:#2A2F34;
    --green:#34C97A; --green-deep:#4ADE80; --green-soft:#173425; --green-tint:#14251C;
    --blue:#60A5FA; --blue-soft:#1B2A44; --purple:#A78BFA; --purple-soft:#2A2344;
    --orange:#FBBF24; --orange-soft:#3A2C12; --track:#2A2F34;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --nav-bg:#15181B;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .app{max-width:560px;margin:0 auto;padding:14px 16px 104px}
  a{color:var(--blue);text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
  .icbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative;color:var(--ink)}
  .icbtn:hover{background:var(--card)}
  .icbtn svg{display:block}
  .bell-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid var(--bg)}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-weight:700;display:grid;place-items:center;font-size:16px}
  .topbar .right{display:flex;align-items:center;gap:6px}

  /* greeting */
  .greetrow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
  h1.greet{font-size:clamp(24px,6vw,30px);font-weight:800;letter-spacing:-.02em;margin:0 0 4px;line-height:1.15}
  .datesub{color:var(--muted);font-size:14px}
  .tagline{font-size:14px;color:var(--ink-2);margin-top:10px}
  .streakcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:var(--shadow);text-align:center;min-width:132px}
  .streakcard .slab{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
  .streakcard .snum{font-size:26px;font-weight:800;line-height:1.2}
  .streakcard .snum small{font-size:13px;font-weight:600;color:var(--muted)}
  .streakcard .ssub{font-size:12px;color:var(--ink-2);margin-top:4px}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .cardhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .cardhead .eyebrow{color:var(--ink-2)}
  .seelink{font-size:13px}

  /* focus card */
  .focus{background:var(--green-tint);border-color:var(--green-soft);display:flex;gap:14px;align-items:center}
  .focus .ficon{flex:none;width:62px;height:62px;border-radius:16px;background:var(--green-soft);display:grid;place-items:center;color:var(--green)}
  .focus .fbody{flex:1;min-width:0}
  .focus .eyebrow{color:var(--green-deep)}
  .focus h2{font-size:19px;font-weight:800;margin:3px 0 2px;letter-spacing:-.01em}
  .focus .fsub{font-size:13px;color:var(--muted)}
  .focus .chev{flex:none;width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--green)}
  .bar{height:8px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .barline{display:flex;justify-content:space-between;font-size:12.5px;margin-top:7px;font-variant-numeric:tabular-nums}
  .barline b{font-weight:700}
  .ontrack{color:var(--green-deep);font-weight:600}

  /* stat tiles */
  .tiles{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:14px}
  @media(min-width:460px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
  .tile .ticon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:6px}
  .tile .tnum{font-size:21px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .tile .tlab{font-size:12px;color:var(--muted)}
  .chip{margin-top:8px;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 10px}
  .c-green{background:var(--green-soft);color:var(--green-deep)}
  .c-blue{background:var(--blue-soft);color:var(--blue)}
  .c-purple{background:var(--purple-soft);color:var(--purple)}
  .c-orange{background:var(--orange-soft);color:var(--orange)}
  .i-green{background:var(--green-soft);color:var(--green)}
  .i-blue{background:var(--blue-soft);color:var(--blue)}
  .i-purple{background:var(--purple-soft);color:var(--purple)}
  .i-orange{background:var(--orange-soft);color:var(--orange)}

  /* plan */
  .plangrid{display:grid;gap:18px}
  @media(min-width:520px){.plangrid{grid-template-columns:1fr 1fr}}
  .tl{position:relative}
  .tlrow{display:flex;gap:12px;padding:7px 0}
  .tltime{flex:none;width:46px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px;text-align:right}
  .tldotcol{flex:none;width:14px;display:flex;flex-direction:column;align-items:center}
  .tldot{width:12px;height:12px;border-radius:50%;margin-top:3px;flex:none}
  .tlline{width:2px;flex:1;background:var(--line);margin-top:3px}
  .tlrow:last-child .tlline{display:none}
  .tlt{font-size:13.5px;font-weight:700}
  .tls{font-size:12px;color:var(--muted)}
  .tlrow.nowrow .tlt{color:var(--green-deep)}
  .d-green{background:var(--green)} .d-blue{background:var(--blue)} .d-purple{background:var(--purple)} .d-gray{background:#C3C9D0}
  .motiv{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;padding:8px 4px}
  .motiv .m1{font-size:14px;color:var(--ink-2);margin-top:8px}
  .motiv .m2{font-size:19px;font-weight:800;color:var(--green-deep);letter-spacing:-.01em}
  .startbtn{margin-top:14px;background:var(--green-soft);color:var(--green-deep);font-weight:700;font-size:14px;border-radius:999px;padding:12px 22px;display:inline-flex;align-items:center;gap:8px}
  .startbtn:hover{background:var(--green);color:#fff}

  /* tasks */
  ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .task{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:opacity .3s}
  .task .tick{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid #C3C9D0;background:var(--card);display:grid;place-items:center;font-size:13px;line-height:1;color:transparent}
  .task .tick:hover{border-color:var(--green)}
  .task.done{opacity:.6}
  .task.done .tick{background:var(--green);border-color:var(--green);color:#fff}
  .task.done .tname{text-decoration:line-through}
  .tname{font-weight:600;font-size:14px}
  .tmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .tproj{display:inline-block;font-size:11px;font-weight:700;color:var(--green-deep);background:var(--green-soft);border-radius:999px;padding:1px 9px;margin-right:6px}
  .tasknote{font-size:12.5px;color:var(--muted);margin-top:10px}

  /* journey */
  .journey{display:flex;align-items:flex-start;margin:14px 0 4px}
  .jstep{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
  .jline{flex:1;height:2px;background:var(--line);margin-top:14px;min-width:14px}
  .jline.jdone{background:var(--green)}
  .jcirc{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
  .jcirc.done{background:var(--green);color:#fff}
  .jcirc.now{background:var(--card);border:3px solid var(--blue-soft);border-top-color:var(--blue);border-right-color:var(--blue)}
  .jcirc.todo{background:var(--card);border:3px solid var(--track)}
  .jlab{font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
  .jstep.on .jlab{color:var(--ink);font-weight:600}

  /* project cards */
  .sect{display:flex;align-items:baseline;gap:10px;margin:22px 2px 12px}
  .sect h2{font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
  .sect .cnote{font-size:12.5px;color:var(--muted)}
  details.pcard summary{list-style:none;cursor:pointer}
  details.pcard summary::-webkit-details-marker{display:none}
  .prow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .prow h3{font-size:16px;font-weight:800;margin:0}
  .ptag{font-size:13px;color:var(--muted);margin-top:2px}
  .due-pill{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .cols{display:grid;gap:14px;margin-top:14px}
  @media(min-width:520px){.cols{grid-template-columns:1fr 1fr}}
  .colh{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .checklist{margin:0;padding:0;list-style:none;font-size:13px;display:flex;flex-direction:column;gap:5px}
  .checklist li{padding-left:22px;position:relative;color:var(--ink-2)}
  .checklist li::before{position:absolute;left:0;top:0}
  .checklist.donels li::before{content:"✓";color:var(--green);font-weight:700}
  .checklist.remainls li::before{content:"○";color:var(--muted)}
  .cheer{font-size:13px;color:var(--green-deep);background:var(--green-soft);border-radius:12px;padding:10px 13px;margin-top:12px}
  .plinks{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px}

  /* split cards */
  .split{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-bottom:14px}
  @media(max-width:430px){.split{grid-template-columns:1fr}}
  .mini{margin-bottom:0;padding:16px}
  .mini .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .mini .row:last-child{border-bottom:none}
  .mini .row .when{color:var(--muted);font-size:12px;white-space:nowrap;margin-left:8px}
  .mini .rname{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* wins */
  .wins-grid{display:grid;gap:10px}
  @media(min-width:460px){.wins-grid{grid-template-columns:1fr 1fr}}
  .win{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
  .win .wicon{flex:none;width:38px;height:38px;border-radius:12px;background:var(--orange-soft);display:grid;place-items:center;font-size:18px}
  .win .wt{font-weight:700;font-size:13.5px}
  .win .wd{font-size:12px;color:var(--muted);margin-top:1px}
  .win.locked{opacity:.5}
  .win.locked .wicon{background:var(--bg)}

  /* chart */
  .chart svg{width:100%;height:auto;display:block}
  .chart text{font:11px Inter,sans-serif;fill:var(--muted)}
  .chart .val{font-weight:700;fill:var(--ink)}

  /* rhythm table */
  table.week{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  table.week td{padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
  table.week td:first-child{font-weight:800;width:46px;color:var(--green-deep)}
  table.week tr:last-child td{border-bottom:none}

  /* bottom nav */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);border-top:1px solid var(--line);z-index:30}
  .navin{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
  .navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);width:64px;padding:4px 0}
  .navbtn svg{display:block}
  .navbtn[aria-selected="true"]{color:var(--green-deep)}
  .fab{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(22,163,74,.35);margin-top:-26px}
  .fab:hover{background:var(--green-deep)}
  .fablabel{font-size:11px;font-weight:600;color:var(--muted);margin-top:3px}

  /* modal + sheet */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:40;display:grid;place-items:end center}
  .sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:560px;padding:22px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
  .sheet h2{font-size:17px;font-weight:800;margin:0 0 4px}
  .sheet .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
  .sheet input,.sheet select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .primarybtn{width:100%;background:var(--green);color:#fff;font-weight:700;border-radius:999px;padding:13px;font-size:15px}
  .primarybtn:hover{background:var(--green-deep)}
  .sheet .menu a{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px dashed var(--line);color:var(--ink);font-weight:600;font-size:14px}
  .sheet .menu a:last-child{border-bottom:none}
  .sheet .menu a span{color:var(--muted);font-weight:400;font-size:12.5px}

  /* toast + confetti */
  #toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .35s;z-index:60;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .view{display:none}
  .view.active{display:block;animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .suncard{background:linear-gradient(160deg,var(--green-tint),var(--card));border:1px solid var(--green-soft);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
  .suncard h2{font-size:19px;font-weight:800;margin:0}
  .suncard p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
  .footer-note{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
  .profilehead{display:flex;gap:14px;align-items:center;margin-bottom:16px}
  .bigavatar{width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:23px;display:grid;place-items:center}
  .profilehead .pn{font-size:18px;font-weight:800}
  .profilehead .pe{font-size:13px;color:var(--muted)}

  /* ========== ENHANCED FEATURES V2 ========== */
  
  /* Search Bar */
  .search-bar{display:flex;gap:8px;margin-bottom:14px;align-items:center}
  .search-bar input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--ink);font:inherit}
  .search-bar input::placeholder{color:var(--muted)}
  .search-bar button{width:40px;height:40px;border-radius:12px;background:var(--blue);color:white;display:grid;place-items:center}
  
  /* Modal Overlay */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;z-index:1000;align-items:center;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal-content{background:var(--card);border-radius:24px;padding:24px;max-width:90%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .modal-header h2{margin:0;font-size:24px}
  .modal-close{width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  
  /* Task with Deadline */
  .task-deadline{font-size:12px;color:var(--muted);margin-top:4px}
  .deadline-overdue{color:#EF4444}
  .deadline-soon{color:var(--orange)}
  .deadline-ok{color:var(--green)}
  
  /* Export Button */
  .export-btn{margin-top:14px;padding:10px 14px;background:var(--blue-soft);color:var(--blue);border-radius:12px;font-weight:600;text-align:center;cursor:pointer;display:inline-block}
  .export-btn:hover{background:var(--blue);color:white}
  
  /* Calendar Heatmap Preview */
  .heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
  .heatday{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:600}
  .heat-0{background:var(--line);color:var(--muted)}
  .heat-1{background:var(--green-tint);color:var(--green)}
  .heat-2{background:var(--green-soft);color:var(--green-deep)}
  .heat-3{background:var(--green);color:white}
  
  /* Shortcuts Help */
  .shortcuts-modal .shortcut-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .shortcut-row kbd{background:var(--line);padding:2px 6px;border-radius:4px;font-family:monospace}

  
  /* Calendar Heatmap */
  .calendar-container{margin:16px 0}
  .calendar-month{margin-bottom:20px}
  .calendar-month-label{font-weight:700;margin-bottom:8px;color:var(--ink)}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .calendar-day{width:100%;aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s}
  .cal-empty{background:var(--line);color:var(--muted)}
  .cal-0{background:var(--line);color:var(--muted)}
  .cal-1{background:var(--green-tint);color:var(--green)}
  .cal-2{background:var(--green-soft);color:var(--green-deep)}
  .cal-3{background:var(--green);color:white}
  .calendar-day:hover{transform:scale(1.1);box-shadow:var(--shadow)}

  return total? Math.round(100*doneCount/total) : 0;
}
function totalDone(){ return Object.keys(S.done).length; }
function streak(){
  let s=0; const d=new Date(NOW);
  if(!S.history[dayKey(d)]) d.setDate(d.getDate()-1); // allow "yesterday-ended" streaks
  while(S.history[dayKey(d)]>0){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function todaysPlan(){ return DOW===0?null : DOW===6?PLAN_SATURDAY : PLAN_WEEKDAY; }
function toMin(s){ return +s.slice(0,2)*60 + +s.slice(3,5); }
function fmtDur(mins){ const h=Math.floor(mins/60),m=mins%60; return (h?h+"h":"")+(m?" "+m+"m":h?"":"0m"); }

function todaysTasks(){
  const week=THIS_WEEK.map(t=>{
    const f=findTask(t.id);
    if(f) return {...t,name:f.r.t,pname:f.p.name.split("—")[0].trim(),pemoji:f.p.emoji,deadline:f.p.deadline};
    // Synced entries carry their own label, so they survive a project's
    // checklist ids changing underneath them.
    return t.name?{...t,pname:t.pname||"This week",pemoji:t.pemoji||"🔥"}:null;
  }).filter(Boolean);
  const custom=S.custom.filter(c=>c.day===TODAY||!S.done[c.id]).map(c=>({id:c.id,name:c.t,pname:c.proj||"Personal",pemoji:"📝",est:null,why:null,custom:true}));
  const open=[...week.filter(t=>!S.done[t.id]),...custom.filter(t=>!S.done[t.id])];
  const doneList=[...week,...custom].filter(t=>S.done[t.id]===TODAY);
  return {open,doneList,week,custom};
}

function recentWorked(){
  const items=Object.entries(S.done).sort((a,b)=>a[1]<b[1]?1:-1).slice(0,4).map(([id,d])=>{

    return {emoji:p.emoji,name:(p.name||"Personal").split("—")[0].trim(),when};
  }).filter(Boolean);
  const seen=new Set(); return items.filter(r=>!seen.has(r.name)&&seen.add(r.name)).slice(0,3);
}

function bindCommon(root){

function toggleTask(id){
  const was=!!S.done[id];
  if(was){ delete S.done[id]; S.history[TODAY]=Math.max(0,(S.history[TODAY]||0)-1); }
  else{ S.done[id]=TODAY; S.history[TODAY]=(S.history[TODAY]||0)+1; celebrate(id); }
  save(); renderAll();
}

function celebrate(id){
  const f=findTask(id);
  const msgs=[CHEERS[Math.floor(Math.random()*CHEERS.length)]];
  if(f&&f.p) msgs.push(`${f.p.emoji} ${f.p.name.split("—")[0].trim()} is now ${projProgress(f.p)}% along.`);
  if((S.history[TODAY]||0)===3) msgs.push("Three today — that's a full day. 🌟");
  toast(msgs.join("  "));
  confetti();
  checkUnlocks(f);
}

function checkUnlocks(f){
  const t=totalDone(); const dt=S.history[TODAY]||0;
  const won=[];
  const un=(k,c)=>{ if(c&&!S.unlocked[k]){S.unlocked[k]=TODAY;won.push(k);} };
  un("first",t>=1); un("three",dt>=3); un("five",t>=5); un("ten",t>=10); un("streak3",streak()>=3);
  un("projdone", f && f.p && projProgress(f.p)===100);
  if(won.length){ const u=UNLOCKS.find(x=>x[0]===won[0]); setTimeout(()=>toast(`🏆 Achievement: ${u[2]}!`),1700); }
  save();
}

let toastTimer;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),3400); }

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#confetti"),x=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  const cols=["#16A34A","#34C97A","#F59E0B","#8B5CF6","#2563EB"];
  const ps=Array.from({length:70},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*0.62,
    vx:(Math.random()-.5)*9,vy:-5-Math.random()*7,r:3+Math.random()*4,c:cols[Math.random()*cols.length|0],a:1,rot:Math.random()*6}));
  let n=0;
  (function tick(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;p.a-=0.012;p.rot+=0.1;
      if(p.a>0){x.save();x.globalAlpha=p.a;x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();}});
    if(++n<110) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);
  })();
}

let searchQuery = '';

// Deadline utilities
function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = new Date(dateStr);
  const today = new Date();
  today.setHours(0,0,0,0);
  const days = Math.ceil((target - today)/(1000*60*60*24));
  return days;
}

function deadlineStatus(dateStr){
  const days = daysUntil(dateStr);
  if(days === null) return null;
  if(days < 0) return {label:'OVERDUE',class:'deadline-overdue'};
  if(days === 0) return {label:'Today',class:'deadline-soon'};
  if(days <= 3) return {label:`${days}d left`,class:'deadline-soon'};
  return {label:`${days}d`,class:'deadline-ok'};
}

function closeModal(){
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
}

// Export/Import
function exportState(){
  const data = {
    exported: new Date().toISOString(),
    state: S,
    projects: PROJECTS
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `daybreak-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('📥 Backup downloaded');
}

function importState(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = event => {
      try {
        const data = JSON.parse(event.target.result);
        S = data.state || {};
        save();
        renderAll();
        toast('📤 Backup restored');
      } catch(err) {
        toast('❌ Invalid backup file');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Keyboard shortcuts
function initKeyboardShortcuts(){
  document.addEventListener('keydown', e => {
    if(e.target !== document.body) return; // Don't trigger in inputs
    
    const key = e.key.toLowerCase();
    
    if(key === 'j') { go('projects'); e.preventDefault(); toast('Jump to Projects'); }
    else if(key === '+' || key === '=') {

      toast('New task');

    else if(key === 'n') {

    }
  });
}

// ========== PHASE 2 FEATURES ==========

// 1. TASK DEADLINES
function formatDeadline(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const days = daysUntil(dateStr);
  if (days === null) return '';
  if (days < 0) return ` <span class="task-deadline-badge deadline-overdue">OVERDUE ${Math.abs(days)}d</span>`;
  if (days === 0) return ` <span class="task-deadline-badge deadline-soon">DUE TODAY</span>`;
  if (days <= 3) return ` <span class="task-deadline-badge deadline-soon">DUE ${days}d</span>`;
  return ` <span class="task-deadline-badge deadline-ok">${date.toLocaleDateString('en-US', {month:'short',day:'numeric'})}</span>`;
}

// 2. RECURRING TASKS
function isRecurring(taskId) {
  return S.recurring && S.recurring[taskId];
}

function toggleRecurring(taskId) {
  if (!S.recurring) S.recurring = {};
  S.recurring[taskId] = !S.recurring[taskId];
  save();
  renderHome();
}

function autoPopulateRecurringTasks() {
  if (!S.lastRecurringReset) S.lastRecurringReset = TODAY;
  
  const lastReset = new Date(S.lastRecurringReset);
  const today = new Date();
  const daysSinceReset = Math.floor((today - lastReset) / (1000*60*60*24));
  
  // Reset on Monday (day 1)
  if (DOW === 1 && daysSinceReset >= 7) {
    THIS_WEEK.forEach(t => {
      if (S.recurring && S.recurring[t.id]) {
        delete S.done[t.id]; // Clear completion for recurring tasks
      }
    });
    S.lastRecurringReset = TODAY;
    save();
  }
}

// 3. CALENDAR VIEW / HEATMAP
function renderCalendar() {
  const v = document.getElementById("calendar-mount");
  if (!v) return;

  const months = [];
  for (let i = 2; i >= 0; i--) {
    const d = new Date();
    d.setMonth(d.getMonth() - i);
    months.push(d);
  }
  
  let calHTML = '';
  months.forEach(monthStart => {
    const year = monthStart.getFullYear();
    const month = monthStart.getMonth();
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const startDay = first.getDay();
    
    calHTML += `<div class="calendar-month">
      <div class="calendar-month-label">${first.toLocaleDateString('en-US', {month:'short',year:'numeric'})}</div>
      <div class="calendar-grid">`;
    
    // Empty cells for alignment
    for (let i = 0; i < startDay; i++) {
      calHTML += '<div class="calendar-day cal-empty"></div>';
    }
    
    // Days
    for (let day = 1; day <= last.getDate(); day++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const completed = S.history[dateStr] || 0;
      const intensity = Math.min(3, Math.floor(completed / 3));
      calHTML += `<div class="calendar-day cal-${intensity}" title="${completed} tasks">${day}</div>`;
    }
    
    calHTML += '</div></div>';
  });
  
  v.innerHTML = `
    <div class="card">
      <div class="cardhead"><span class="eyebrow">Last 3 months</span></div>
      ${calHTML}
      <div class="calendar-legend">
        <span style="color:var(--muted);font-size:11px">Less</span>
        <div class="cal-legend-item"><div class="cal-legend-box cal-0"></div></div>
        <div class="cal-legend-item"><div class="cal-legend-box cal-1"></div></div>
        <div class="cal-legend-item"><div class="cal-legend-box cal-2"></div></div>
        <div class="cal-legend-item"><div class="cal-legend-box cal-3"></div></div>
        <span style="color:var(--muted);font-size:11px">More</span>
      </div>
    </div>
  `;
}

// 5. BROWSER NOTIFICATIONS
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function sendNotification(title, options = {}) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, {
      icon: '🌅',
      badge: '✓',
      ...options
    });
  }
}

function scheduleNotifications() {
  if (!S.notificationsEnabled) return;
  
  // Daily reminder at 7am
  const now = new Date();
  const sevenAM = new Date();
  sevenAM.setHours(7, 0, 0, 0);
  
  if (now < sevenAM) {
    const delay = sevenAM - now;
    setTimeout(() => {
      sendNotification('Good morning! Ready to move things forward?', {
        body: `${THIS_WEEK.filter(t => !S.done[t.id]).length} tasks waiting`
      });
    }, delay);
  }
}

async function enableNotifications(){
  if(!("Notification" in window)){ toast("This browser can't do notifications"); return; }
  const perm = await Notification.requestPermission();
  if(perm==="granted"){ S.notificationsEnabled=true; save(); scheduleNotifications();
    toast("🔔 Morning nudge on"); sendNotification("Daybreak", {body:"You'll get a gentle nudge at 7am."}); }
  else { toast("Notifications blocked in browser settings"); }
  renderProfile(); renderCalendar();
}
function disableNotifications(){ S.notificationsEnabled=false; save(); toast("Nudge off"); renderProfile(); renderCalendar(); }

autoPopulateRecurringTasks();
scheduleNotifications();

// A real orientation lock, where the platform allows one. Chrome on Android
// grants this to an installed PWA; Safari rejects it and desktop browsers
// throw outright, so a failure here is expected and the CSS overlay covers it.
function lockPortrait(){
  const o = screen.orientation;
  if(o && typeof o.lock === 'function'){
    o.lock('portrait').catch(() => {});
  }
}
lockPortrait();
if(screen.orientation) screen.orientation.addEventListener('change', lockPortrait);

// Offline support. The page is regenerated by the Trello sync each morning, so
// sw.js fetches the document network-first and only falls back to its copy.
if('serviceWorker' in navigator){
  addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      // Unregistered is fine — the app is one file and works without it.
    });
  });
}
