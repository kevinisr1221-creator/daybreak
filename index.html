<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybreak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
  :root{
    --bg:#F7F3EA; --surface:#FFFFFF; --surface-2:#F1ECDF; --ink:#232048; --ink-2:#4A4668;
    --muted:#77738F; --line:#E4DECC; --accent:#A87F1F; --accent-ink:#8A6716;
    --accent-soft:#F3E8CC; --gold-bar:#C29A34; --good:#3E7C4F; --good-soft:#E4EFE6;
    --lavender:#ECE9F6; --track:#E9E3D2; --shadow:0 1px 2px rgba(35,32,72,.05),0 6px 20px rgba(35,32,72,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171430; --surface:#211E42; --surface-2:#2A2650; --ink:#EFECF9; --ink-2:#C9C5E2;
      --muted:#9B96BC; --line:#332F5C; --accent:#E0B45C; --accent-ink:#E7BE6E;
      --accent-soft:#3A3155; --gold-bar:#D8AC4E; --good:#8CC79B; --good-soft:#26382E;
      --lavender:#2B2752; --track:#312C5A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171430; --surface:#211E42; --surface-2:#2A2650; --ink:#EFECF9; --ink-2:#C9C5E2;
    --muted:#9B96BC; --line:#332F5C; --accent:#E0B45C; --accent-ink:#E7BE6E;
    --accent-soft:#3A3155; --gold-bar:#D8AC4E; --good:#8CC79B; --good-soft:#26382E;
    --lavender:#2B2752; --track:#312C5A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1060px;margin:0 auto;padding:0 20px 80px}
  a{color:var(--accent-ink);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* header */
  header{padding:34px 0 8px}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
  h1.greet{font-family:Spectral,Georgia,serif;font-weight:500;font-size:clamp(28px,4.5vw,40px);line-height:1.15;margin:6px 0 4px;text-wrap:balance}
  .datesub{color:var(--muted);font-size:14px}
  .headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .streak-chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow);white-space:nowrap}
  .streak-chip strong{color:var(--ink)}

  /* nav */
  nav.tabs{display:flex;gap:6px;margin:22px 0 26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px 12px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tab:hover{color:var(--ink)}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
  .card h2{font-family:Spectral,Georgia,serif;font-weight:600;font-size:19px;margin:0 0 4px}
  .card h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .grid{display:grid;gap:16px}
  @media(min-width:820px){.grid.two{grid-template-columns:3fr 2fr}.grid.half{grid-template-columns:1fr 1fr}}

  /* meters */
  .meter{height:10px;background:var(--track);border-radius:999px;overflow:hidden}
  .meter>i{display:block;height:100%;background:var(--gold-bar);border-radius:999px;transition:width .6s cubic-bezier(.22,1,.36,1)}
  .meter.small{height:7px}
  .pctline{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
  .pctline b{color:var(--ink);font-size:14px}

  /* task list */
  ul.tasks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .task{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;transition:opacity .3s}
  .task .tick{flex:none;width:24px;height:24px;margin-top:1px;border-radius:8px;border:2px solid var(--muted);background:none;display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}
  .task .tick:hover{border-color:var(--accent)}
  .task.done{opacity:.62}
  .task.done .tick{background:var(--good);border-color:var(--good);color:#fff}
  .task.done .tname{text-decoration:line-through}
  .tname{font-weight:600;font-size:14.5px}
  .tmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tproj{display:inline-block;font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 9px;margin-right:6px}

  /* stages */
  .journey{display:flex;align-items:center;gap:0;margin:12px 0 4px;flex-wrap:wrap;row-gap:8px}
  .stage{display:flex;align-items:center;gap:0}
  .stage .dot{width:10px;height:10px;border-radius:50%;background:var(--track);border:2px solid var(--track)}
  .stage.donept .dot{background:var(--gold-bar);border-color:var(--gold-bar)}
  .stage.now .dot{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .stage .slabel{font-size:11.5px;color:var(--muted);margin:0 8px 0 6px;white-space:nowrap}
  .stage.now .slabel{color:var(--ink);font-weight:600}
  .stage .link{width:18px;height:2px;background:var(--track);margin-right:8px}
  .stage.donept .link{background:var(--gold-bar)}

  /* project cards */
  .cat-head{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
  .cat-head h2{font-family:Spectral,Georgia,serif;font-size:21px;font-weight:600;margin:0}
  .cat-head .cnote{font-size:13px;color:var(--muted)}
  .pcard{cursor:pointer}
  .pcard:hover{border-color:var(--accent)}
  .prow{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .ptag{font-size:12.5px;color:var(--muted)}
  .due-pill{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--lavender);border-radius:999px;padding:2px 10px;white-space:nowrap}
  details.pdetail summary{list-style:none;cursor:pointer}
  details.pdetail summary::-webkit-details-marker{display:none}
  .cols{display:grid;gap:14px;margin-top:14px}
  @media(min-width:640px){.cols{grid-template-columns:1fr 1fr}}
  .checklist{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
  .checklist li{padding-left:24px;position:relative;color:var(--ink-2)}
  .checklist li::before{position:absolute;left:0;top:0}
  .checklist.donels li::before{content:"✓";color:var(--good);font-weight:700}
  .checklist.remainls li::before{content:"○";color:var(--muted)}
  .boardlink{font-size:12.5px;font-weight:600}
  .cheer{font-size:13px;color:var(--accent-ink);background:var(--accent-soft);border-radius:9px;padding:8px 12px;margin-top:12px}

  /* rhythm */
  .rblock{display:flex;gap:14px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .rblock:last-child{border-bottom:none}
  .rtime{flex:none;width:104px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
  .rname{font-weight:600;font-size:14.5px}
  .rnote{font-size:12.5px;color:var(--muted)}
  .rblock.now{background:var(--accent-soft);border-radius:10px;padding:11px 12px;margin:0 -12px;border-bottom:none}
  .rblock.now .rtime{color:var(--accent-ink);font-weight:600}
  .nowchip{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--accent-ink);text-transform:uppercase;margin-left:8px}
  table.week{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  table.week td{padding:9px 8px;border-bottom:1px dashed var(--line);vertical-align:top}
  table.week td:first-child{font-weight:700;width:52px;color:var(--accent-ink)}
  table.week tr:last-child td{border-bottom:none}

  /* wins */
  .wins-grid{display:grid;gap:12px}
  @media(min-width:640px){.wins-grid{grid-template-columns:1fr 1fr}}
  .win{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .win .wicon{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px}
  .win .wt{font-weight:600;font-size:14px}
  .win .wd{font-size:12.5px;color:var(--muted);margin-top:1px}
  .win.locked{opacity:.5}
  .win.locked .wicon{background:var(--surface-2)}

  /* stats */
  .tiles{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow)}
  .tile .num{font-family:Spectral,Georgia,serif;font-size:32px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .tile .lab{font-size:12.5px;color:var(--muted);margin-top:6px}
  .chart{margin-top:8px}
  .chart svg{width:100%;height:auto;display:block}
  .chart text{font:11.5px Inter,sans-serif;fill:var(--muted)}
  .chart .val{font-weight:600;fill:var(--ink)}

  /* toast + confetti */
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .35s;z-index:50;max-width:88vw;text-align:center}
  :root[data-theme="dark"] #toast{background:var(--accent);color:#171430}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
  .view{display:none}
  .view.active{display:block;animation:fadein .35s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .sun-card{background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
  .sun-card p{margin:6px 0 0;color:var(--ink-2)}
  .footer-note{margin-top:44px;font-size:12.5px;color:var(--muted);text-align:center}
</style>

<div class="wrap">
  <header>
    <div class="headrow">
      <div>
        <div class="kicker">Daybreak · your command center</div>
        <h1 class="greet" id="greeting">Good morning, Kevin 👋</h1>
        <div class="datesub" id="datesub"></div>
      </div>
      <div class="streak-chip" id="streakchip"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-view="today" aria-selected="true">Today</button>
    <button class="tab" role="tab" data-view="projects" aria-selected="false">Projects</button>
    <button class="tab" role="tab" data-view="rhythm" aria-selected="false">Rhythm</button>
    <button class="tab" role="tab" data-view="wins" aria-selected="false">Wins</button>
    <button class="tab" role="tab" data-view="progress" aria-selected="false">Progress</button>
  </nav>

  <main>
    <section class="view active" id="view-today"></section>
    <section class="view" id="view-projects"></section>
    <section class="view" id="view-rhythm"></section>
    <section class="view" id="view-wins"></section>
    <section class="view" id="view-progress"></section>
  </main>

  <p class="footer-note">Built from your own Trello boards and calendar — nothing here was re-entered by hand. One good step at a time. 🌱</p>
</div>

<canvas id="confetti"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

/* ============ state ============ */
const KEY="daybreak-v1";
let S={done:{},history:{},unlocked:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const NOW=new Date();
const dayKey=d=>d.toISOString().slice(0,10);
const TODAY=dayKey(NOW);
const DOW=NOW.getDay(); // 0=Sun
const FEST_ON = TODAY>="2026-08-28" && TODAY<="2026-08-30";

function findTask(id){ for(const p of PROJECTS){ const r=p.remaining.find(x=>x.id===id); if(r) return {p,r}; } return null; }
function projProgress(p){
  const doneCount=p.done.length + p.remaining.filter(r=>S.done[r.id]).length;
  const total=p.done.length + p.remaining.length;
  return total? Math.round(100*doneCount/total) : 0;
}
function totalDone(){ return Object.keys(S.done).length; }

function taskHTML(t){
  const f=findTask(t.id); if(!f) return "";
  const done=!!S.done[t.id];
  return `<li class="task ${done?"done":""}">
    <button class="tick" data-task="${t.id}" aria-pressed="${done}" aria-label="${done?"Completed":"Mark complete"}: ${esc(f.r.t)}">✓</button>
    <div><div class="tname">${esc(f.r.t)}</div>
    <div class="tmeta"><span class="tproj">${f.p.emoji} ${esc(f.p.name.split("—")[0].trim())}</span>≈ ${t.est}${t.why?` · ${esc(t.why)}`:""}</div></div></li>`;
}

function bindTicks(root){
  root.querySelectorAll(".tick").forEach(b=>b.addEventListener("click",()=>toggleTask(b.dataset.task)));
}

function toggleTask(id){
  const was=!!S.done[id];
  if(was){ delete S.done[id]; S.history[TODAY]=Math.max(0,(S.history[TODAY]||0)-1); }
  else{
    S.done[id]=TODAY; S.history[TODAY]=(S.history[TODAY]||0)+1;
    celebrate(id);
  }
  save(); renderAll();
}

function celebrate(id){
  const f=findTask(id);
  const pct=f?projProgress(f.p):0;
  const msgs=[CHEERS[Math.floor(Math.random()*CHEERS.length)]];
  if(f) msgs.push(`${f.p.emoji} ${f.p.name.split("—")[0].trim()} is now ${pct}% along.`);
  const dt=(S.history[TODAY]||0);
  if(dt===3) msgs.push("Three today — that's a full day. 🌟");
  toast(msgs.join("  "));
  confetti();
  checkUnlocks(f);
}

function checkUnlocks(f){
  const t=totalDone(); const dt=S.history[TODAY]||0;
  const days=Object.keys(S.history).filter(k=>S.history[k]>0).sort();
  let streak=1;
  for(let i=days.length-1;i>0;i--){
    const a=new Date(days[i]), b=new Date(days[i-1]);
    if((a-b)/864e5<=1.5) streak++; else break;
  }
  const won=[];
  const un=(k,c)=>{ if(c&&!S.unlocked[k]){S.unlocked[k]=TODAY;won.push(k);} };
  un("first",t>=1); un("three",dt>=3); un("five",t>=5); un("ten",t>=10); un("streak3",streak>=3&&days.length>=3);
  un("projdone", f && projProgress(f.p)===100);
  if(won.length){ const u=UNLOCKS.find(x=>x[0]===won[0]); setTimeout(()=>toast(`🏆 Achievement: ${u[2]}!`),1600); }
  save();
}

/* ============ progress ============ */
function renderProgress(){
  const v=$("#view-progress");

  // this week's Mon–Sun
  const monday=new Date(NOW); monday.setDate(NOW.getDate()-((DOW+6)%7));
  const labels=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const vals=labels.map((_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return S.history[dayKey(d)]||0; });
  const max=Math.max(3,...vals);
  const W=560,H=180,pad=26,bw=Math.floor((W-pad*2)/7*0.52),step=(W-pad*2)/7;
  const bars=vals.map((n,i)=>{
    const h=n?Math.max(6,Math.round((H-58)*n/max)):0;
    const x=pad+step*i+(step-bw)/2, y=H-34-h;
    return `${n?`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="var(--gold-bar)"></rect>
      <text class="val" x="${x+bw/2}" y="${y-7}" text-anchor="middle">${n}</text>`:""}
      <text x="${x+bw/2}" y="${H-14}" text-anchor="middle">${labels[i]}</text>`;

      <div class="ptag">Tasks completed each day — every bar is a day you showed up.</div>
      <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed per day this week">
        <line x1="${pad}" y1="${H-34}" x2="${W-pad}" y2="${H-34}" stroke="var(--line)"></line>${bars}</svg></div>
      ${vals.every(n=>!n)?`<div class="cheer">The chart starts drawing itself the moment you tick your first task. No pressure — just a pencil waiting. ✏️</div>`
        :`<div class="cheer">${vals.reduce((a,b)=>a+b,0)} task${vals.reduce((a,b)=>a+b,0)===1?"":"s"} this week. Progress you can point at.</div>`}
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Where every project stands</h2>
      ${PROJECTS.filter(p=>p.cat!=="parked").map(p=>{const pct=projProgress(p);
        return `<div style="margin-top:14px"><div class="pctline" style="margin:0 0 5px"><span><b style="font-size:13.5px">${p.emoji} ${esc(p.name)}</b></span><span>${pct}%</span></div>

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#confetti"),x=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  const cols=["#C29A34","#E0B45C","#3E7C4F","#8B84C9","#D96C4F"];
  const ps=Array.from({length:70},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*0.62,
    vx:(Math.random()-.5)*9,vy:-5-Math.random()*7,r:3+Math.random()*4,c:cols[Math.random()*cols.length|0],a:1,rot:Math.random()*6}));
  let n=0;
  (function tick(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.28;p.a-=0.012;p.rot+=0.1;
      if(p.a>0){x.save();x.globalAlpha=p.a;x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();}});
    if(++n<110) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height);
  })();
}

function renderAll(){ renderHeader(); renderToday(); renderProjects(); renderRhythm(); renderWins(); renderProgress(); }
renderAll();
</script>
